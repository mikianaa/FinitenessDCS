name = "FinitenessDCS"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["FinitenessDCS"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# Not a Mathlib file tree: skip the copyright-header check.
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0"

[[lean_lib]]
name = "FinitenessDCS"

# `lake build Lint` runs the environment linters and the axiom check (see `Lint.lean`).
[[lean_lib]]
name = "Lint"
