name: API docs

# doc-gen4 documents the whole dependency closure, Mathlib included, which takes
# hours and a lot of disk.  Keep it out of the regular CI: run it on pushes to
# `main` (where docgen-action deploys to GitHub Pages) or by hand.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
      - uses: leanprover-community/docgen-action@v1
