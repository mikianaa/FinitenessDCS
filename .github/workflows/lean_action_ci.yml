name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          # Treat linter warnings as errors.
          build-args: "--wfail"
      - name: Environment linters and axiom check (sorry-free, standard axioms only)
        run: lake build Lint --wfail
      # API documentation is generated by the separate `docs.yml` workflow: doc-gen4
      # also documents Mathlib, which takes hours and exhausted the runner's disk here.
